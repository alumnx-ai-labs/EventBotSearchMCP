services:
  - type: web
    name: eventbot-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    plan: free
    envVars:
      - key: FASTMCP_HOST
        value: 0.0.0.0
      - key: FASTMCP_PORT
        value: 10000
      - key: FASTMCP_LOG_LEVEL
        value: INFO
